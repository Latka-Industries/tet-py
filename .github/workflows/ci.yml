name: CI

on:
  push:
    branches: [main, master, dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    branches: [main, master, dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE*"
      - ".gitignore"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Test
        run: |
          uv sync --extra dev --extra convert
          uv run maturin develop
          uv run mypy python/tet
          uv run pytest -q
