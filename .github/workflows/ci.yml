name: CI

on:
  push:
    branches: [main, master, dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    branches: [main, master, dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE*"
      - ".gitignore"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Start MinIO
        if: runner.os == 'Linux'
        run: ./.github/scripts/start-minio.sh

      - name: Test
        env:
          TETRATION_S3_ENDPOINT: ${{ runner.os == 'Linux' && 'http://127.0.0.1:9000' || '' }}
          TETRATION_S3_BUCKET: ${{ runner.os == 'Linux' && 'tetration-test' || '' }}
          TETRATION_S3_ACCESS_KEY: ${{ runner.os == 'Linux' && 'tetration' || '' }}
          TETRATION_S3_SECRET_KEY: ${{ runner.os == 'Linux' && 'tetration-secret' || '' }}
          TETRATION_S3_REQUIRED: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          uv sync --extra dev --extra convert
          uv run maturin develop
          uv run mypy python/tet
          uv run pytest -q
